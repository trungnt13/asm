name: fork-v8-release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected V8 dependency after its build and smoke tests pass
        type: boolean
        default: false
      target:
        description: Build only the required V8 dependency
        type: choice
        options:
          - x86_64-unknown-linux-musl
          - aarch64-apple-darwin
        default: x86_64-unknown-linux-musl
  push:
    tags:
      - 'asm-v8-v*'

concurrency:
  group: ${{ github.workflow }}::${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      target: ${{ steps.version.outputs.target }}
      runner: ${{ steps.version.outputs.runner }}
      platform: ${{ steps.version.outputs.platform }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH: ${{ inputs.publish || false }}
          TARGET: ${{ inputs.target || 'x86_64-unknown-linux-musl' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 .github/scripts/rusty_v8_bazel.py resolved-v8-crate-version)"
          if [[ "$REF" == refs/tags/* ]]; then
            case "$REF_NAME" in
              *-musl.1) TARGET=x86_64-unknown-linux-musl ;;
              *-glibc2.35.2) TARGET=aarch64-apple-darwin ;;
              *) echo 'Unsupported V8 dependency tag' >&2; exit 1 ;;
            esac
          fi
          case "$TARGET" in
            x86_64-unknown-linux-musl) runner=ubuntu-24.04; platform=linux_amd64_musl ;;
            aarch64-apple-darwin) runner=macos-15; platform=macos_arm64 ;;
            *) echo "Unsupported V8 target: $TARGET" >&2; exit 1 ;;
          esac
          tag="$(python3 .github/scripts/verify-fork-v8.py --tag "$TARGET" "$version")"
          printf 'target=%s\nrunner=%s\nplatform=%s\ntag=%s\n' "$TARGET" "$runner" "$platform" "$tag" >> "$GITHUB_OUTPUT"
          if [[ "$REF" == refs/tags/* ]]; then
            [[ "$REF_NAME" == "$tag" ]] || { echo 'V8 tag and resolved crate version differ' >&2; exit 1; }
            [[ "$(git rev-parse "${REF_NAME}^{commit}")" == "$(git rev-parse "${GITHUB_SHA}^{commit}")" ]] || {
              echo 'V8 tag does not point to this workflow commit' >&2; exit 1;
            }
          fi
          if [[ "$REF" == refs/tags/* || "$PUBLISH" == true ]]; then
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/trungnt13/asm/releases/tags/${tag}")"
            case "$status" in
              404) ;;
              200) echo "Release $tag already exists; refusing to replace assets" >&2; exit 1 ;;
              *) echo "Could not check V8 release $tag (HTTP $status)" >&2; exit 1 ;;
            esac
            if [[ "$REF" != refs/tags/* ]]; then
              status="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/trungnt13/asm/git/ref/tags/${tag}")"
              case "$status" in
                404) ;;
                200) echo "V8 tag $tag already exists; refusing to move it" >&2; exit 1 ;;
                *) echo "Could not check V8 tag $tag (HTTP $status)" >&2; exit 1 ;;
              esac
            fi
          fi

  build:
    needs: metadata
    name: Build V8 ${{ needs.metadata.outputs.target }}
    runs-on: ${{ needs.metadata.outputs.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ needs.metadata.outputs.target }}
          cache-scope: fork-v8
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ needs.metadata.outputs.target }}
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
      - if: ${{ runner.os == 'Linux' }}
        name: Install native musl smoke tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential musl-tools
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=$(command -v musl-gcc)" >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-Clink-arg=-Wl,--no-dynamic-linker' >> "$GITHUB_ENV"
      - name: Build and stage V8 archive and Rust binding
        env:
          TARGET: ${{ needs.metadata.outputs.target }}
          PLATFORM: ${{ needs.metadata.outputs.platform }}
        run: |
          set -euo pipefail
          python3 .github/scripts/rusty_v8_bazel.py stage-release-pair \
            --platform "$PLATFORM" --target "$TARGET" --sandbox --compilation-mode opt \
            --output-dir "dist/$TARGET" --bazel-config fork-v8-local
      - name: Smoke test V8 sandbox and JavaScript execution
        env:
          TARGET: ${{ needs.metadata.outputs.target }}
        run: |
          set -euo pipefail
          archive="${GITHUB_WORKSPACE}/dist/${TARGET}/librusty_v8_ptrcomp_sandbox_release_${TARGET}.a.gz"
          binding="${GITHUB_WORKSPACE}/dist/${TARGET}/src_binding_ptrcomp_sandbox_release_${TARGET}.rs"
          test -f "$archive" && test -f "$binding"
          cd codex-rs
          RUSTY_V8_ARCHIVE="$archive" RUSTY_V8_SRC_BINDING_PATH="$binding" \
            just test -p codex-v8-poc --target "$TARGET" --features sandbox \
              --run-ignored all --locked
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fork-v8-${{ needs.metadata.outputs.target }}
          path: dist/${{ needs.metadata.outputs.target }}/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/asm-v8-v') || inputs.publish == true
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      - name: Publish only the selected target pair and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          TARGET: ${{ needs.metadata.outputs.target }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          assets=()
          dir="dist/fork-v8-${TARGET}"
          for name in "librusty_v8_ptrcomp_sandbox_release_${TARGET}.a.gz" \
            "src_binding_ptrcomp_sandbox_release_${TARGET}.rs" \
            "rusty_v8_ptrcomp_sandbox_release_${TARGET}.sha256"; do
            test -s "$dir/$name" || { echo "Missing $name" >&2; exit 1; }
            assets+=("$dir/$name")
          done
          (cd "$dir" && sha256sum --check --strict "rusty_v8_ptrcomp_sandbox_release_${TARGET}.sha256")
          [[ "$(find dist -type f | wc -l)" -eq 3 ]] || { echo 'Unexpected V8 assets' >&2; exit 1; }
          if [[ "$REF" != refs/tags/* ]]; then
            gh api --method POST repos/trungnt13/asm/git/refs \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          gh release create "$TAG" "${assets[@]}" -R trungnt13/asm \
            --verify-tag --title "$TAG" --notes 'Fork-built V8 dependencies for ASM.' \
            --latest=false
