name: postmerge-ci

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}::${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Release build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - if: ${{ contains(matrix.target, 'linux-musl') }}
        name: Use hermetic Cargo home
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"
      - if: ${{ contains(matrix.target, 'linux-musl') }}
        name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - if: ${{ contains(matrix.target, 'linux-musl') }}
        name: Install musl build tools
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
      - if: ${{ contains(matrix.target, 'linux-musl') }}
        name: Disable aws-lc jitter entropy
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"
      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Build codex
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET" --bin codex

  results:
    name: Fork postmerge results
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: '[[ "$BUILD_RESULT" == success ]]'
