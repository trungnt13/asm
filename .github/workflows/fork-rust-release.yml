name: fork-rust-release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Prepare, publish, verify, then update main (only on main)'
        type: boolean
        default: false
      resume_run_id:
        description: 'Resume the immutable candidate from an earlier release run'
        type: string
        default: ''
      macos_concurrency_experiment:
        description: 'Build macOS with 2 and 3 Cargo jobs; never publish'
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: fork-rust-release
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Resolve immutable release candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tag: ${{ steps.candidate.outputs.tag }}
      candidate_ref: ${{ steps.candidate.outputs.candidate_ref }}
      publish: ${{ steps.candidate.outputs.publish }}
      published: ${{ steps.candidate.outputs.published }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Freeze or resume candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release == true || (startsWith(github.ref, 'refs/tags/v') && inputs.macos_concurrency_experiment != true) }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          BUILD_EXPERIMENT: ${{ inputs.macos_concurrency_experiment }}
        run: |
          if [[ "$BUILD_EXPERIMENT" == true && ( "$PUBLISH_RELEASE" == true || -n "$RESUME_RUN_ID" ) ]]; then
            echo 'Build experiments cannot publish or resume a release' >&2
            exit 1
          fi
          python3 .github/scripts/prepare-fork-release.py prepare
          cat "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  build:
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.published != 'true' && (needs.find_postmerge.result == 'skipped' || (needs.find_postmerge.result == 'success' && needs.find_postmerge.outputs.reuse != 'true')) }}
    needs: [prepare, find_postmerge]
    name: Build ${{ matrix.target }} (jobs ${{ matrix.jobs }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
      CARGO_PROFILE_RELEASE_STRIP: "debuginfo"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.macos_concurrency_experiment == true && '[{"runner":"macos-15","timeout":180,"target":"aarch64-apple-darwin","jobs":2},{"runner":"macos-15","timeout":180,"target":"aarch64-apple-darwin","jobs":3}]' || '[{"runner":"macos-15","timeout":180,"target":"aarch64-apple-darwin","jobs":0},{"runner":"ubuntu-22.04","timeout":90,"target":"x86_64-unknown-linux-gnu","jobs":0}]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - if: ${{ contains(matrix.target, 'linux-gnu') }}
        name: Install Python for artifact verification
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - if: ${{ contains(matrix.target, 'linux-gnu') }}
        name: Install GNU build tools
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-gnu-build-tools.sh"

      - if: ${{ contains(matrix.target, 'linux-gnu') }}
        name: Disable aws-lc jitter entropy
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
          repository: trungnt13/asm

      - name: Build ASM with resource sampling
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUILD_JOBS: ${{ matrix.jobs }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/diagnostics"
          if [[ "$RUNNER_OS" == macOS ]]; then
            logical_cpus=$(sysctl -n hw.logicalcpu)
            ram_bytes=$(sysctl -n hw.memsize)
          else
            logical_cpus=$(nproc)
            ram_bytes=$(awk '/MemTotal:/ { print $2 * 1024 }' /proc/meminfo)
          fi
          printf 'build_jobs=%s logical_cpus=%s ram_bytes=%s\n' "$BUILD_JOBS" "$logical_cpus" "$ram_bytes" > "${GITHUB_WORKSPACE}/diagnostics/resources-${TARGET}.log"
          (while true; do
            echo "Resource sample $(date -u)"
            df -h "${GITHUB_WORKSPACE}" || echo 'Filesystem sample unavailable'
            if [[ "$RUNNER_OS" == macOS ]]; then
              memory_pressure | sed -n '1,8p' || echo 'Memory-pressure sample unavailable'
              sysctl vm.swapusage || echo 'Swap sample unavailable'
              top -l 1 -n 0 | sed -n '1,12p' || echo 'System sample unavailable'
              ps -Ao pid,ppid,%cpu,rss,comm | sort -k4,4nr | sed -n '1,15p' || echo 'Process sample unavailable'
            else
              free -h || echo 'Memory sample unavailable'
              ps -eo pid,comm,%cpu,%mem,rss --sort=-rss | sed -n '1,12p' || echo 'Process sample unavailable'
            fi
            sleep 60
          done) >> "${GITHUB_WORKSPACE}/diagnostics/resources-${TARGET}.log" 2>&1 &
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true' EXIT
          build_args=(--release --target "$TARGET" --bin codex --bin codex-code-mode-host --timings)
          if [[ "$BUILD_JOBS" != 0 ]]; then build_args+=(--jobs "$BUILD_JOBS"); fi
          cargo build "${build_args[@]}"

      - name: Create archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          release_dir="target/${TARGET}/release"
          binary="${release_dir}/codex"
          helper="${release_dir}/codex-code-mode-host"
          archive="${GITHUB_WORKSPACE}/dist/codex-${TARGET}.tar.gz"

          [[ -x "$binary" ]] || { echo "Missing executable: $binary" >&2; exit 1; }
          [[ -x "$helper" ]] || { echo "Missing executable: $helper" >&2; exit 1; }
          mkdir -p "$(dirname "$archive")"
          tar -C "$release_dir" -czf "$archive" codex codex-code-mode-host

      - name: Smoke packaged ASM
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/.github/scripts/smoke-codex-archive.py" "${GITHUB_WORKSPACE}/dist/codex-${TARGET}.tar.gz" | tee "${GITHUB_WORKSPACE}/diagnostics/smoke-${TARGET}.log"

      - name: Smoke packaged ASM on clean Ubuntu 22.04
        if: ${{ contains(matrix.target, 'linux-gnu') }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          bash "${GITHUB_WORKSPACE}/.github/scripts/smoke-ubuntu-archive.sh" "${GITHUB_WORKSPACE}/dist/codex-${TARGET}.tar.gz" "$version" | tee "${GITHUB_WORKSPACE}/diagnostics/smoke-ubuntu-${TARGET}.log"

      - name: Upload archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.jobs == 0 && format('codex-{0}', matrix.target) || format('experiment-codex-{0}-jobs-{1}', matrix.target, matrix.jobs) }}
          path: dist/codex-${{ matrix.target }}.tar.gz
          if-no-files-found: error

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: diagnostics-${{ matrix.target }}-jobs-${{ matrix.jobs }}
          path: |
            diagnostics/resources-${{ matrix.target }}.log
            diagnostics/smoke-${{ matrix.target }}.log
            diagnostics/smoke-ubuntu-${{ matrix.target }}.log
            codex-rs/target/cargo-timings/cargo-timing*.html
          if-no-files-found: warn

  find_postmerge:
    name: Find verified candidate archives
    needs: prepare
    if: ${{ needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.published != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    permissions:
      actions: read
      contents: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 2
      - name: Find exact-candidate archives
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ needs.prepare.outputs.candidate_ref }}
        run: bash .github/scripts/find-postmerge-artifacts.sh

  release:
    name: Publish and verify immutable release
    needs: [prepare, find_postmerge, build]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true' && (needs.prepare.outputs.published == 'true' || (needs.find_postmerge.result == 'success' && (needs.find_postmerge.outputs.reuse == 'true' || needs.build.result == 'success'))) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Download macOS archive
        if: ${{ needs.prepare.outputs.published != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-aarch64-apple-darwin
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ needs.find_postmerge.outputs.reuse == 'true' && needs.find_postmerge.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download Linux archive
        if: ${{ needs.prepare.outputs.published != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-x86_64-unknown-linux-gnu
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ needs.find_postmerge.outputs.reuse == 'true' && needs.find_postmerge.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Create checksum manifest
        if: ${{ needs.prepare.outputs.published != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archives=(codex-aarch64-apple-darwin.tar.gz codex-x86_64-unknown-linux-gnu.tar.gz)
          cp "${GITHUB_WORKSPACE}/scripts/install/install.sh" install.sh
          [[ $(find . -maxdepth 1 -type f | wc -l) -eq 3 ]] || { echo 'Unexpected release files' >&2; exit 1; }
          for archive in "${archives[@]}"; do
            [[ -s "$archive" ]] || { echo "Missing $archive" >&2; exit 1; }
            python3 "${GITHUB_WORKSPACE}/.github/scripts/smoke-codex-archive.py" "$archive" --inspect-only
          done
          sha256sum "${archives[@]}" install.sh > SHA256SUMS

      - name: Publish or verify existing release without overwrites
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          ALREADY_PUBLISHED: ${{ needs.prepare.outputs.published }}
        run: |
          if [[ "$ALREADY_PUBLISHED" == true ]]; then
            python3 .github/scripts/publish-fork-release.py verify
          else
            python3 .github/scripts/publish-fork-release.py publish
          fi

  verify_native:
    name: Verify published ${{ matrix.target }} binaries
    needs: [prepare, release]
    if: ${{ always() && !cancelled() && needs.release.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Download and smoke the published archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --pattern "codex-${TARGET}.tar.gz" --pattern SHA256SUMS --dir dist
          cd dist
          grep "  codex-${TARGET}.tar.gz$" SHA256SUMS | shasum -a 256 -c -
          cd ../codex-rs
          python3 ../.github/scripts/smoke-codex-archive.py "${GITHUB_WORKSPACE}/dist/codex-${TARGET}.tar.gz"

  sync_main:
    name: Advance main only after release verification
    needs: [prepare, verify_native]
    if: ${{ always() && !cancelled() && needs.verify_native.result == 'success' && needs.prepare.outputs.candidate_ref != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Preserve concurrent main changes and merge the released candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          CANDIDATE_REF: ${{ needs.prepare.outputs.candidate_ref }}
        run: python3 .github/scripts/prepare-fork-release.py sync-main
