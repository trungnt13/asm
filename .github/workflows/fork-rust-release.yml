name: fork-rust-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}::${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: ${{ always() && !cancelled() && (needs.find_postmerge.result == 'skipped' || (needs.find_postmerge.result == 'success' && needs.find_postmerge.outputs.reuse != 'true')) }}
    needs: find_postmerge
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            timeout: 180
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            timeout: 90
            target: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - if: ${{ contains(matrix.target, 'linux-musl') }}
        name: Use hermetic Cargo home
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - if: ${{ contains(matrix.target, 'linux-musl') }}
        name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - if: ${{ contains(matrix.target, 'linux-musl') }}
        name: Install musl build tools
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - if: ${{ contains(matrix.target, 'linux-musl') }}
        name: Disable aws-lc jitter entropy
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build codex with resource sampling
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/diagnostics"
          (while true; do
            echo "Resource sample $(date -u)"
            df -h "${GITHUB_WORKSPACE}" || echo 'Filesystem sample unavailable'
            if [[ "$RUNNER_OS" == macOS ]]; then
              memory_pressure | sed -n '1,8p' || echo 'Memory-pressure sample unavailable'
              sysctl vm.swapusage || echo 'Swap sample unavailable'
              top -l 1 -n 0 | sed -n '1,12p' || echo 'System sample unavailable'
              ps -Ao pid,ppid,%cpu,rss,comm | sort -k4,4nr | sed -n '1,15p' || echo 'Process sample unavailable'
            else
              free -h || echo 'Memory sample unavailable'
              ps -eo pid,comm,%cpu,%mem,rss --sort=-rss | sed -n '1,12p' || echo 'Process sample unavailable'
            fi
            sleep 60
          done) > "${GITHUB_WORKSPACE}/diagnostics/resources-${TARGET}.log" 2>&1 &
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true' EXIT
          cargo build --release --target "$TARGET" --bin codex --timings

      - name: Create archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          release_dir="target/${TARGET}/release"
          binary="${release_dir}/codex"
          archive="${GITHUB_WORKSPACE}/dist/codex-${TARGET}.tar.gz"

          [[ -x "$binary" ]] || { echo "Missing executable: $binary" >&2; exit 1; }
          mkdir -p "$(dirname "$archive")"
          tar -C "$release_dir" -czf "$archive" codex

      - name: Upload archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ matrix.target }}
          path: dist/codex-${{ matrix.target }}.tar.gz
          if-no-files-found: error

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            diagnostics/resources-${{ matrix.target }}.log
            codex-rs/target/cargo-timings/cargo-timing*.html
          if-no-files-found: warn

  find_postmerge:
    name: Find matching postmerge archives
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    permissions:
      actions: read
      contents: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Find exact-commit postmerge archives
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/find-postmerge-artifacts.sh

  release:
    name: Publish GitHub release
    needs: [find_postmerge, build]
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.find_postmerge.result == 'success' && (needs.find_postmerge.outputs.reuse == 'true' || needs.build.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download macOS archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-aarch64-apple-darwin
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ needs.find_postmerge.outputs.reuse == 'true' && needs.find_postmerge.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download Linux archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-x86_64-unknown-linux-musl
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ needs.find_postmerge.outputs.reuse == 'true' && needs.find_postmerge.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Create checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archives=(codex-aarch64-apple-darwin.tar.gz codex-x86_64-unknown-linux-musl.tar.gz)
          [[ $(find . -maxdepth 1 -type f | wc -l) -eq 2 ]] || { echo 'Unexpected release files' >&2; exit 1; }
          for archive in "${archives[@]}"; do
            [[ -s "$archive" ]] || { echo "Missing $archive" >&2; exit 1; }
            python3 - "$archive" <<'PYARCHIVE'
          import sys
          import tarfile
          with tarfile.open(sys.argv[1], 'r:gz') as archive:
              members = archive.getmembers()
              if len(members) != 1 or members[0].name != 'codex' or not members[0].isfile() or members[0].size == 0 or not members[0].mode & 0o111:
                  raise SystemExit(f'Invalid CLI archive: {sys.argv[1]}')
          PYARCHIVE
          done
          sha256sum "${archives[@]}" > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Minimal fork build containing only the Codex CLI executable.

            The macOS ARM64 binary is unsigned and unnotarized. The Linux x86_64
            archive does not include bundled Bubblewrap; install `bwrap` on the
            host when Linux sandboxing requires it.
          files: |
            dist/codex-aarch64-apple-darwin.tar.gz
            dist/codex-x86_64-unknown-linux-musl.tar.gz
            dist/SHA256SUMS
