name: blocking-ci

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}::${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  general:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --config imports_granularity=Item --check

  build:
    name: Clippy ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - if: ${{ contains(matrix.target, 'linux-gnu') }}
        name: Install Python for artifact verification
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - if: ${{ contains(matrix.target, 'linux-gnu') }}
        name: Install GNU build tools
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-gnu-build-tools.sh"
      - if: ${{ contains(matrix.target, 'linux-gnu') }}
        name: Disable aws-lc jitter entropy
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"
      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
          repository: trungnt13/asm
      - name: Run Clippy
        env:
          TARGET: ${{ matrix.target }}
        run: cargo clippy -p codex-cli -p codex-tui -p codex-core -p codex-config --target "$TARGET" --lib --bin codex -- -D warnings

  results:
    name: Fork CI results (required)
    if: ${{ always() }}
    needs: [general, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful checks
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          GENERAL_RESULT: ${{ needs.general.result }}
        run: |
          [[ "$GENERAL_RESULT" == success ]] || exit 1
          [[ "$BUILD_RESULT" == success ]] || exit 1
